<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="978" viewBox="0 0 1240 978"><rect width="1240" height="978" fill="#0d1117"/><text x="50" y="58" font-family="sans-serif" font-size="34" fill="#e6edf3" font-weight="bold" text-anchor="start">Mai - code excerpts from mein.py (sanitized)</text><text x="50" y="96" font-family="sans-serif" font-size="22" fill="#8b949e" text-anchor="start">Excerpts verbatim from the production source; token and raw channel/guild IDs are not shown.</text><rect x="50" y="130" width="1140" height="240" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="78" y="168" font-family="sans-serif" font-size="23" fill="#e3b341" font-weight="bold" text-anchor="start">Setup - the bot requests all intents at login (this is why removal stopped it entirely)</text><text x="92" y="216" font-family="sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">intents = discord.Intents.default()</text><text x="92" y="256" font-family="sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">bot = commands.Bot(command_prefix=&quot;!&quot;, intents=discord.Intents.all())</text><text x="92" y="296" font-family="sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">intents.messages = True</text><text x="92" y="336" font-family="sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">intents.presences = True   # flag only - monitoring feature not implemented</text><rect x="50" y="396" width="1140" height="280" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="78" y="434" font-family="sans-serif" font-size="23" fill="#e3b341" font-weight="bold" text-anchor="start">Message Content - trade flow reads what users type (amount, then payment link)</text><text x="92" y="482" font-family="sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">def check(m):</text><text x="92" y="522" font-family="sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">    return m.author == user and m.channel == trade_channel2 and m.content.isdigit()</text><text x="92" y="562" font-family="sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">msg = await bot.wait_for(&quot;message&quot;, check=check, timeout=120)</text><text x="92" y="602" font-family="sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">def pay_check(m):</text><text x="92" y="642" font-family="sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">    return m.author == interaction.user and &quot;https://pay.paypay.ne.jp/&quot; in m.content</text><rect x="50" y="702" width="1140" height="240" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="78" y="740" font-family="sans-serif" font-size="23" fill="#e3b341" font-weight="bold" text-anchor="start">Server Members - member objects drive economy / moderation / favorites</text><text x="92" y="788" font-family="sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">async def give(interaction, member: discord.Member, amount: int)      # economy</text><text x="92" y="828" font-family="sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">async def timeout(interaction, member: discord.Member, duration: int) # moderation</text><text x="92" y="868" font-family="sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">user = guild.get_member(payload.user_id)                              # favorites</text><text x="92" y="908" font-family="sans-serif" font-size="21" fill="#e6edf3" text-anchor="start">user_count = sum(guild.member_count for guild in bot.guilds)          # status</text></svg>