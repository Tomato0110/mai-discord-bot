<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="994" viewBox="0 0 1240 994"><rect width="1240" height="994" fill="#0d1117"/><text x="50" y="58" font-family="sans-serif" font-size="34" fill="#e6edf3" font-weight="bold" text-anchor="start">Mai - Discord Bot: Which features use which Privileged Intent</text><text x="50" y="96" font-family="sans-serif" font-size="22" fill="#8b949e" text-anchor="start">App ID 1222381695911854091 - 28 servers - Python (discord.py), source: mein.py (1,701 lines)</text><rect x="50" y="130" width="1140" height="272" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="78" y="172" font-family="sans-serif" font-size="27" fill="#3fb950" font-weight="bold" text-anchor="start">MESSAGE CONTENT INTENT</text><text x="92" y="230" font-family="sans-serif" font-size="24" fill="#e6edf3" text-anchor="start">-  &quot;!&quot; text-prefix commands (commands.Bot, command_prefix=&quot;!&quot;)</text><text x="92" y="276" font-family="sans-serif" font-size="24" fill="#e6edf3" text-anchor="start">-  Trade flow: bot.wait_for('message') reads a typed amount (content.isdigit())</text><text x="92" y="322" font-family="sans-serif" font-size="24" fill="#e6edf3" text-anchor="start">-  Trade flow: verifies a payment link posted in the channel ('paypay.ne.jp' in content)</text><text x="92" y="368" font-family="sans-serif" font-size="24" fill="#e6edf3" text-anchor="start">-  Favorites: on_raw_reaction_add fetches message.content and DMs it to the user</text><rect x="50" y="430" width="1140" height="272" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="78" y="472" font-family="sans-serif" font-size="27" fill="#58a6ff" font-weight="bold" text-anchor="start">SERVER MEMBERS INTENT</text><text x="92" y="530" font-family="sans-serif" font-size="24" fill="#e6edf3" text-anchor="start">-  Economy commands take Member targets (give / tip / add_coins)</text><text x="92" y="576" font-family="sans-serif" font-size="24" fill="#e6edf3" text-anchor="start">-  Moderation commands take Member targets (timeout / ban)</text><text x="92" y="622" font-family="sans-serif" font-size="24" fill="#e6edf3" text-anchor="start">-  guild.get_member(user_id) in the favorites feature</text><text x="92" y="668" font-family="sans-serif" font-size="24" fill="#e6edf3" text-anchor="start">-  guild.member_count totals shown in the bot's rotating status</text><rect x="50" y="730" width="1140" height="226" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="78" y="772" font-family="sans-serif" font-size="27" fill="#8b949e" font-weight="bold" text-anchor="start">NOT REQUESTED</text><text x="92" y="830" font-family="sans-serif" font-size="24" fill="#e6edf3" text-anchor="start">-  Presence Intent - flag exists in code, but the activity-monitoring feature</text><text x="92" y="876" font-family="sans-serif" font-size="24" fill="#e6edf3" text-anchor="start">-  was never implemented (variables only). Not requested, to keep this</text><text x="92" y="922" font-family="sans-serif" font-size="24" fill="#e6edf3" text-anchor="start">-  application limited to intents the bot actually uses.</text></svg>